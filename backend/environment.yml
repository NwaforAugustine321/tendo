name: tendo
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - cryptography
  - pip:
    - fastapi
    - uvicorn[standard]
    - langgraph
    - langgraph-checkpoint-redis
    - langchain-anthropic
    - langchain-google-genai
    - langchain-ollama
    - langchain-huggingface
    - langchain-xai
    - langchain-groq
    - langchain-core
    - langchain-nvidia-ai-endpoints
    - supabase
    - pydantic
    - pydantic-settings
    - redis
    - mem0ai
    - httpx
    - python-dotenv
    - python-multipart
    - google-genai
    - websockets
    - pytest
    - pytest-asyncio
    - ruff
    - psycopg2-binary
    - tiktoken
    # Pipecat pipeline (NVIDIA NIM Parakeet ASR + Magpie TTS + WebRTC VAD)
    # Install in conda env with:
    #   pip install "pipecat-ai[nim,websocket]" wait_for2 pyloudnorm soxr \
    #               aiofiles nltk num2words opentelemetry-sdk loguru scipy --no-deps
    - pipecat-ai
    - wait_for2
    - pyloudnorm
    - soxr
    - aiofiles
    - nltk
    - num2words
    - opentelemetry-sdk
    - loguru
    - scipy
