name: voice-agent
channels:
  - defaults
  - conda-forge

dependencies:
  - python=3.11
  - pip

  - pip:
      - fastapi==0.115.12
      - uvicorn[standard]==0.34.2
      - pydantic==2.11.5
      - pydantic-settings==2.9.1
      - httpx==0.28.1
      - supabase==2.15.2
      - pymongo==4.12.1
      - livekit==1.1.15
      - livekit-agents==1.7.1
      - livekit-plugins-nvidia==1.7.1
      # dev
      - pytest==8.3.5
      - pytest-asyncio==0.25.3
      # install the package itself in editable mode
      - -e .
