

[project]
name = "tendo"
version = "0.1.0"
description = "Tendo — AI Business Operating System"
requires-python = ">=3.12,<3.13"

dependencies = [
  # --- Web / API ---------------------------------------------------------
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "websockets",
  "python-socketio",

  # --- Agent / LLM stack -------------------------------------------------
  "langgraph",
  "langgraph-checkpoint-redis",
  "langchain-core",
  "langchain-text-splitters",
  "langchain-anthropic",
  "langchain-google-genai",
  "langchain-ollama",
  "langchain-huggingface",
  "langchain-xai",
  "langchain-groq",
  "langchain-openai",
  "langchain-nvidia-ai-endpoints",
  "google-genai",
  "nemoguardrails",
  "mem0ai",
  "tiktoken",

  # --- Data stores -------------------------------------------------------
  "supabase",
  "redis",
  "psycopg2-binary",
  "pymongo",
  "neo4j",

  # --- Core runtime ------------------------------------------------------
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "httpx",
  "apscheduler",
  "pyarrow",
  "json-repair",
  "markdownify",

  # --- Voice -------------------------------------------------------------
  # LiveKit agent dependencies have been moved to the dedicated
  # voice_agent microservice (backend/app/voice_agent/pyproject.toml).
  #
  # nvidia-riva-client is kept here because the audio RAG loader
  # (app/runtime/rag/ingestion/loaders/audio.py) imports it directly.
  "nvidia-riva-client",

  
  "nvidia-rag[rag,ingest]",
  "lancedb",


  # --- Document ingestion (RAG loaders) ----------------------------------
  "opendataloader-pdf==2.5.0",
  "pymupdf==1.28.0",

  # --- Transitive pins for prebuilt x86_64 macOS wheels ------------------
  # argon2-cffi-bindings (via minio -> argon2-cffi): 26.1.0 ships only
  # macosx_11_0_arm64; 25.1.0 still ships macosx_10_9_x86_64.
  #
  # cryptography: 50.0.1 has no x86_64 macOS wheel; 48.0.1 does.
  #
  # Both are enforced automatically by --no-build, but pinned here so the
  # constraint is visible rather than implicit.
  "argon2-cffi-bindings==25.1.0",
  "cryptography==48.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pytest-asyncio]
mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]  
exclude = ["data*", "migrations*", "tests*"]
